# The library, the composer, the skill and the release on every push to main and every pull request; then the site.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json

      - name: Install
        run: |
          npm ci
          npm --prefix site ci

      - name: Format
        run: npm run format:check

      # builds, then six suites; also fails while skills/blockcharts differs from a fresh build
      - name: Test
        run: npm test

      # layout in a real browser (the runner's Google Chrome): where a card lands, what sticks out of a phone screen
      - name: Layout in Chrome
        run: node scripts/test-chrome.js

      # the release, the example reports, the skill download, Astro, then the link and chart checks
      - name: Site
        run: npm run site

      # every page of the site in Chrome at 320, 360 and 390 px: none wider than the screen, no table that scrolls
      - name: Site on a phone
        run: npm run test:site
